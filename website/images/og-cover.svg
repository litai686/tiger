<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Tiger Agent — 本地优先的 AI 编码助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="55%" stop-color="#0b0d16"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7c6cff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 品牌标 -->
  <g transform="translate(80 84)">
    <rect width="58" height="58" rx="14" fill="#10121c" stroke="#7c6cff" stroke-opacity="0.5"/>
    <path d="M16 19h26M23 19v20M35 19v20" stroke="#a78bfa" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M11 29h7M40 29h7" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="156" y="124" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#e9ebf5">Tiger <tspan fill="#a78bfa">Agent</tspan></text>

  <!-- 标题 -->
  <text x="80" y="268" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="800" fill="url(#title)" letter-spacing="-1.5">本地优先的</text>
  <text x="80" y="352" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">AI 编码助手</text>

  <text x="80" y="420" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#b3b9cc">Go 服务端跑 Agent · Tauri 桌面端做界面 · 模型由你决定</text>

  <!-- 标签 -->
  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#b3b9cc">
    <g transform="translate(80 470)">
      <rect width="188" height="46" rx="23" fill="#7c6cff" fill-opacity="0.14" stroke="#7c6cff" stroke-opacity="0.42"/>
      <text x="94" y="30" text-anchor="middle">27 个内置工具</text>
    </g>
    <g transform="translate(288 470)">
      <rect width="176" height="46" rx="23" fill="#7c6cff" fill-opacity="0.14" stroke="#7c6cff" stroke-opacity="0.42"/>
      <text x="88" y="30" text-anchor="middle">Skills / MCP / LSP</text>
    </g>
    <g transform="translate(484 470)">
      <rect width="196" height="46" rx="23" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.38"/>
      <text x="98" y="30" text-anchor="middle">上下文压缩</text>
    </g>
    <g transform="translate(700 470)">
      <rect width="168" height="46" rx="23" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.38"/>
      <text x="84" y="30" text-anchor="middle">每轮可撤销</text>
    </g>
  </g>

  <!-- 终端卡片 -->
  <g transform="translate(700 150)">
    <rect width="430" height="250" rx="16" fill="#0d0f18" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="6" fill="#febc2e"/>
    <circle cx="70" cy="24" r="6" fill="#28c840"/>
    <text x="94" y="29" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#7f879e">tigerAgent · agent</text>
    <line x1="0" y1="46" x2="430" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="14">
      <text x="26" y="84" fill="#7f879e">$ <tspan fill="#e9ebf5">tigerAgent --host tcp://…</tspan></text>
      <text x="26" y="114" fill="#34d399">✓ server ready</text>
      <text x="26" y="152" fill="#22d3ee">you › 重构 src/auth 并补测试</text>
      <text x="26" y="180" fill="#a78bfa">⚙ view    src/auth/*.go</text>
      <text x="26" y="204" fill="#a78bfa">⚙ edit    +42 −18</text>
      <text x="26" y="228" fill="#a78bfa">⚙ bash    go test ./internal/auth</text>
    </g>
  </g>

  <text x="80" y="588" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#7f879e">tiger.kuda520.com</text>
  <text x="1120" y="588" text-anchor="end" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#7f879e">Windows · macOS · Linux</text>
</svg>
