[package]
name = "tiger"
version = "0.1.0"
description = "Tiger desktop client"
authors = ["tigerAgent"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tiger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Tiger"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 调试日志时间戳用本地时间格式化（std 无本地时区 API）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
# 远程服务端模式（docs/tcp-tls-ecdsa.md §11）：TLS 1.3 + 服务端 SPKI pin。
# 选 ring 后端以避免 aws-lc-rs 的 CMake/NASM 构建依赖；不启用 tls12（服务端只接受 1.3）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1"
# 反向代理终止 TLS 时按公共根证书校验（reqwest 已传递依赖，此处显式声明直接用）
webpki-roots = "1"
# 计算服务端 SPKI 指纹 sha256(base64url-nopad) 需要解析 X.509
x509-parser = "0.16"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
# Agent 服务端传输（TCP + TLS）：reqwest 无法按 SPKI pin 校验自签证书，
# 用 hyper 直接对 TLS 流发 HTTP/1.1 请求与 SSE 流
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
libc = "0.2"
# hyper-util legacy client 的 Connect 基于 tower-service（hyper 1.9 不再 re-export）
tower-service = "0.3"
dirs = "6"
futures-util = "0.3"
rand = "0.8"
# 原生剪贴板文本读写：Linux（WebKitGTK）下 navigator.clipboard.readText 需宿主发放
# WebKitClipboardPermissionRequest（Tauri/wry 未处理 → 默认拒绝），网页侧复制/粘贴会静默失效，
# 故 linux 端必须由 Rust 直读系统剪贴板。wayland-data-control 让 Wayland 会话走
# ext-data-control 协议（与 GTK 同一个剪贴板），不带该特性只会退化到 X11/XWayland。
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 读取 NSPasteboard 中的文件路径列表（对应 Windows 的 CF_HDROP）
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
