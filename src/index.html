<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiger</title>
  <style>
    /* ===== 主题变量：默认「暗夜紫」，其余主题通过 <html data-theme> 覆盖 =====
       全部前端视图内联在同一文档中，故 :root 变量对所有视图（含 agent）生效 */
    :root {
      --c-bg: #1a1a2e;
      --c-bg-deep: #0d1117;
      --c-panel: #16213e;
      --c-panel-2: #0f3460;
      --c-raise: #1c2331;
      --c-raise-2: #21262d;
      --c-border: #2a2a4e;
      --c-border-soft: #1a1a3e;
      --c-border-hi: #3a3a5e;
      --c-accent: #6c63ff;
      --c-accent-2: #5a52d5;
      --c-accent-rgb: 108, 99, 255;
      --c-text: #e0e0e0;
      --c-text-2: #a0a0c0;
      --c-text-3: #8080a0;
      --c-text-4: #606080;
      --c-text-hi: #ffffff;
      --c-overlay: rgba(255, 255, 255, 0.1);
      --c-overlay-strong: rgba(255, 255, 255, 0.2);
    }
    html[data-theme="vscode"] {
      --c-bg: #1e1e1e; --c-bg-deep: #181818; --c-panel: #252526; --c-panel-2: #2d2d30;
      --c-raise: #2a2d2e; --c-raise-2: #37373d; --c-border: #3c3c3c; --c-border-soft: #2b2b2b;
      --c-border-hi: #4e4e52; --c-accent: #4a9eff; --c-accent-2: #3b82d6; --c-accent-rgb: 74, 158, 255;
      --c-text: #d4d4d4; --c-text-2: #a6a6a6; --c-text-3: #858585; --c-text-4: #6a6a6a; --c-text-hi: #ffffff;
    }
    html[data-theme="onedark"] {
      --c-bg: #282c34; --c-bg-deep: #21252b; --c-panel: #21252b; --c-panel-2: #2c313a;
      --c-raise: #2c313a; --c-raise-2: #3a3f4b; --c-border: #3a3f4b; --c-border-soft: #21252b;
      --c-border-hi: #4b5263; --c-accent: #61afef; --c-accent-2: #4d8fce; --c-accent-rgb: 97, 175, 239;
      --c-text: #abb2bf; --c-text-2: #9da5b4; --c-text-3: #7f848e; --c-text-4: #5c6370; --c-text-hi: #ffffff;
    }
    html[data-theme="light"] {
      --c-bg: #ffffff; --c-bg-deep: #f6f8fa; --c-panel: #f3f3f3; --c-panel-2: #ffffff;
      --c-raise: #eaeaea; --c-raise-2: #e1e4e8; --c-border: #d0d7de; --c-border-soft: #e1e4e8;
      --c-border-hi: #bcc4cc; --c-accent: #0066b8; --c-accent-2: #005a9e; --c-accent-rgb: 0, 102, 184;
      --c-text: #1f2328; --c-text-2: #4b5563; --c-text-3: #6a737d; --c-text-4: #8a94a0; --c-text-hi: #000000;
      --c-overlay: rgba(0, 0, 0, 0.05); --c-overlay-strong: rgba(0, 0, 0, 0.1);
    }
    html[data-theme="sepia"] {
      --c-bg: #fdf6e3; --c-bg-deep: #f4ecd8; --c-panel: #eee8d5; --c-panel-2: #fbf6e6;
      --c-raise: #e7dfc6; --c-raise-2: #ddd6bd; --c-border: #ddd2b0; --c-border-soft: #e7ddc4;
      --c-border-hi: #cabf98; --c-accent: #b5651d; --c-accent-2: #99551a; --c-accent-rgb: 181, 101, 29;
      --c-text: #586e75; --c-text-2: #657b83; --c-text-3: #839496; --c-text-4: #93a1a1; --c-text-hi: #073642;
      --c-overlay: rgba(101, 90, 40, 0.08); --c-overlay-strong: rgba(101, 90, 40, 0.16);
    }
    html[data-theme="github"] {
      --c-bg: #0d1117; --c-bg-deep: #010409; --c-panel: #161b22; --c-panel-2: #21262d;
      --c-raise: #1c2128; --c-raise-2: #21262d; --c-border: #30363d; --c-border-soft: #21262d;
      --c-border-hi: #444c56; --c-accent: #4493f8; --c-accent-2: #2f81f7; --c-accent-rgb: 68, 147, 248;
      --c-text: #c9d1d9; --c-text-2: #adbac7; --c-text-3: #8b949e; --c-text-4: #6e7681; --c-text-hi: #ffffff;
    }
    html[data-theme="dracula"] {
      --c-bg: #282a36; --c-bg-deep: #21222c; --c-panel: #21222c; --c-panel-2: #343746;
      --c-raise: #343746; --c-raise-2: #44475a; --c-border: #44475a; --c-border-soft: #343746;
      --c-border-hi: #6272a4; --c-accent: #bd93f9; --c-accent-2: #a77bea; --c-accent-rgb: 189, 147, 249;
      --c-text: #f8f8f2; --c-text-2: #d5d6e0; --c-text-3: #a0a1b8; --c-text-4: #6272a4; --c-text-hi: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #view-root {
      flex: 1;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--c-bg);
      transition: opacity 0.16s ease-out;
      will-change: opacity;
    }

    /* Agent 常驻视图层：与 #view-root 互斥显示。
       切到其它页面时只隐藏、不卸载 —— 流式渲染、SSE 订阅、滚动位置与
       正在进行的运行态全部保留（状态管理见 doc/frontend-architecture.md）。 */
    #agent-layer {
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--c-bg);
      transition: opacity 0.16s ease-out;
      will-change: opacity;
    }

    #hardware-bar {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--c-panel-2);
      padding: 4px 16px;
      font-size: 12px;
      color: var(--c-text-2);
      border-top: 1px solid var(--c-border-soft);
      flex-shrink: 0;
    }

    #settings-btn,
    #agent-btn,
    #projects-btn,
    #scm-btn,
    #skills-btn {
      cursor: pointer;
      font-size: 13px;
      padding: 2px 10px;
      border-right: 1px solid var(--c-border);
      margin-right: 10px;
      transition: color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .btn-icon {
      font-size: 20px;
      line-height: 1;
      position: relative;
      display: inline-block;
    }

    /* Agent 导航忙碌/完成角标：运行中脉冲点，运行期间切到其它页面并在后台完成时
       显示未读点，回到 Agent 页清除（见壳层 agent-busy-changed 监听） */
    #agent-btn .btn-icon::after {
      content: "";
      position: absolute;
      top: -2px;
      right: -6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c-accent);
      display: none;
    }
    #agent-btn.busy .btn-icon::after,
    #agent-btn.unread .btn-icon::after {
      display: block;
    }
    #agent-btn.busy .btn-icon::after {
      animation: agent-busy-pulse 1.2s ease-in-out infinite;
    }
    @keyframes agent-busy-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.7); }
    }

    .btn-text {
      font-size: 11px;
      font-weight: 500;
    }

    #settings-btn:hover,
    #agent-btn:hover,
    #projects-btn:hover,
    #scm-btn:hover,
    #skills-btn:hover {
      color: var(--c-accent);
    }

    #settings-btn.active,
    #agent-btn.active,
    #projects-btn.active,
    #scm-btn.active,
    #skills-btn.active {
      background: rgba(var(--c-accent-rgb), 0.20);
      color: var(--c-text-hi);
      border-radius: 6px;
      border-right-color: transparent;
    }
    #settings-btn.active .btn-icon,
    #agent-btn.active .btn-icon,
    #projects-btn.active .btn-icon,
    #scm-btn.active .btn-icon,
    #skills-btn.active .btn-icon {
      color: var(--c-accent);
    }

    #hw-items {
      display: flex;
      align-items: center;
      margin-left: auto;
    }

    .hw-item {
      padding: 0 12px;
      border-right: 1px solid var(--c-border);
    }

    .hw-item:last-child {
      border-right: none;
    }

    .hw-label {
      color: var(--c-text-2);
      margin-right: 4px;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      vertical-align: bottom;
    }

    .hw-value {
      color: var(--c-text-hi);
      font-weight: 600;
    }

    /* 更新弹窗样式 */
    #update-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #update-overlay.show {
      display: flex;
    }
    #update-dialog {
      background: var(--c-panel);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #update-dialog .update-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
    #update-dialog .update-title { font-size: 20px; font-weight: 600; color: var(--c-text-hi); text-align: center; margin-bottom: 8px; }
    #update-dialog .update-desc { font-size: 14px; color: var(--c-text-2); text-align: center; margin-bottom: 20px; line-height: 1.6; }
    #update-dialog .update-info-row { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; font-size: 13px; }
    #update-dialog .update-info-row .info-item { text-align: center; }
    #update-dialog .update-info-row .info-label { color: var(--c-text-3); font-size: 11px; }
    #update-dialog .update-info-row .info-value { color: var(--c-text); font-weight: 500; margin-top: 2px; }
    #update-dialog .update-buttons { display: flex; gap: 12px; justify-content: center; }
    #update-dialog .update-btn-primary { background: var(--c-accent); color: #fff; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    #update-dialog .update-btn-primary:hover { background: var(--c-accent-2); }
    #update-dialog .update-btn-secondary { background: var(--c-overlay); color: var(--c-text); border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    #update-dialog .update-btn-secondary:hover { background: var(--c-overlay-strong); }
    #update-dialog .checking-text { text-align: center; color: var(--c-text-3); font-size: 14px; padding: 20px 0; }
    #update-dialog .checking-text .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--c-border); border-top-color: var(--c-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .update-progress-bar { width: 100%; height: 6px; background: var(--c-border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .update-progress-fill { height: 100%; background: var(--c-accent); border-radius: 3px; transition: width 0.3s ease; }
    .update-status-text { font-size: 12px; color: var(--c-text-3); margin-top: 6px; text-align: center; }

    /* 服务端自检失败弹窗（启动时检测配置完整性与健康状态） */
    #server-alert-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    #server-alert-overlay.show { display: flex; }
    #server-alert-dialog {
      background: var(--c-panel);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #server-alert-dialog .server-alert-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
    #server-alert-dialog .server-alert-title { font-size: 18px; font-weight: 600; color: var(--c-text-hi); text-align: center; margin-bottom: 10px; }
    #server-alert-dialog .server-alert-detail { font-size: 13px; color: var(--c-text-2); line-height: 1.6; margin-bottom: 22px; white-space: pre-line; word-break: break-all; max-height: 220px; overflow-y: auto; }
    #server-alert-dialog .server-alert-buttons { display: flex; justify-content: center; }
    #server-alert-dialog .server-alert-btn { background: var(--c-accent); color: #fff; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    #server-alert-dialog .server-alert-btn:hover { background: var(--c-accent-2); }

    /* ===== 视图切换全局过渡 =====
       流程：fade-out 当前视图（160ms）→ 可选展示顶部进度条 + 居中 spinner →
       挂载新视图（opacity:0）→ fade-in（200ms）。
       进度条 / spinner 仅在模块加载超过 180ms 才出现，避免瞬时切换闪烁；
       fade-out / fade-in 始终执行，给用户视觉连续性。
       注意：这里只用 opacity 做过渡，不用 transform —— view-root 内挂着
       .modal-overlay 等 position:fixed 元素，transform 会让 root 成为它们的
       containing block，过渡期间弹窗会错位。 */
    #view-root.view-leaving,
    #agent-layer.view-leaving {
      opacity: 0;
      pointer-events: none;
    }
    #view-root.view-entering,
    #agent-layer.view-entering {
      opacity: 0;
      transition: none; /* 挂载后下一帧再加 transition 才会播 */
    }
    #view-root.view-active,
    #agent-layer.view-active {
      opacity: 1;
      transition: opacity 0.2s ease-out;
    }

    /* 顶部细线进度条（模块加载超阈值时显示） */
    #view-progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0;
      background: linear-gradient(90deg,
        rgba(var(--c-accent-rgb), 0.6),
        var(--c-accent));
      box-shadow: 0 0 6px rgba(var(--c-accent-rgb), 0.5);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      pointer-events: none;
    }
    #view-progress.show { opacity: 1; }
    #view-progress.anim { animation: view-progress 1.2s ease-in-out infinite; }
    @keyframes view-progress {
      0%   { width: 0%;   margin-left: 0%; }
      50%  { width: 60%;  margin-left: 20%; }
      100% { width: 0%;   margin-left: 100%; }
    }

    /* 视图切换 loading 动画（模块加载超阈值才显示，避免瞬时切换时 spinner 闪烁） */
    .view-loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
    .view-loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--c-border);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .view-loading-text { font-size: 13px; color: var(--c-text-3); }

    .global-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: var(--c-panel);
      color: var(--c-text-hi);
      padding: 18px 28px;
      border-radius: 10px;
      font-size: 15px;
      z-index: 9999;
      border: 1px solid var(--c-border-hi);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      cursor: default;
    }


  </style>
  <script>
    // 主题：尽早同步应用（在 body 渲染前），避免首屏闪烁
    // 名称字段为显示文案（设置页主题卡片用），id 才是持久化键；i18n 未就绪时保持中文
    window.__AGENT_THEMES = [
      { id: "default", name: "暗夜紫",      colors: ["#1a1a2e", "#16213e", "#6c63ff"] },
      { id: "vscode",  name: "VS Code 深色", colors: ["#1e1e1e", "#252526", "#4a9eff"] },
      { id: "onedark", name: "One Dark",     colors: ["#282c34", "#21252b", "#61afef"] },
      { id: "github",  name: "GitHub 深色",  colors: ["#0d1117", "#161b22", "#4493f8"] },
      { id: "dracula", name: "Dracula",      colors: ["#282a36", "#44475a", "#bd93f9"] },
      { id: "light",   name: "白色亮色",    colors: ["#ffffff", "#f3f3f3", "#0066b8"] },
      { id: "sepia",   name: "淡黄护眼",    colors: ["#fdf6e3", "#eee8d5", "#b5651d"] }
    ];
    window.getTheme = function () {
      try { return localStorage.getItem("tiger-theme") || "vscode"; } catch (_) { return "vscode"; }
    };
    window.applyTheme = function (id) {
      var valid = window.__AGENT_THEMES.some(function (t) { return t.id === id; });
      var theme = valid ? id : "default";
      if (theme === "default") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("tiger-theme", theme); } catch (_) {}
    };
    window.applyTheme(window.getTheme());
  </script>
</head>
<body>
  <!-- 更新弹窗 -->
  <div id="update-overlay">
    <div id="update-dialog">
      <div id="update-content"></div>
    </div>
  </div>

  <!-- 服务端自检失败提示（启动时） -->
  <div id="server-alert-overlay">
    <div id="server-alert-dialog">
      <div class="server-alert-icon">&#9888;&#65039;</div>
      <div class="server-alert-title" id="server-alert-title" data-i18n="服务端异常，请检查配置">服务端异常，请检查配置</div>
      <div class="server-alert-detail" id="server-alert-detail"></div>
      <div class="server-alert-buttons">
        <button class="server-alert-btn" id="server-alert-ok" data-i18n="去配置服务端">去配置服务端</button>
      </div>
    </div>
  </div>

  <div id="view-progress"></div>

  <div id="app">
    <div id="view-root"></div>
    <div id="hardware-bar">
      <div id="agent-btn" onclick="goAgent()">
        <span class="btn-icon">&#129302;</span>
        <span class="btn-text" data-i18n="Agent">Agent</span>
      </div>
      <div id="projects-btn" onclick="navigateTo('/projects')">
        <span class="btn-icon">📁</span>
        <span class="btn-text" data-i18n="项目管理">项目管理</span>
      </div>
      <div id="scm-btn" onclick="navigateTo('/scm')">
        <span class="btn-icon">🌿</span>
        <span class="btn-text" data-i18n="源码管理">源码管理</span>
      </div>
      <div id="skills-btn" onclick="navigateTo('/skills')">
        <span class="btn-icon">🧩</span>
        <span class="btn-text" data-i18n="技能管理">技能管理</span>
      </div>
      <div id="settings-btn" onclick="navigateTo('/settings')">
        <span class="btn-icon">&#9881;</span>
        <span class="btn-text" data-i18n="设置">设置</span>
      </div>
      <div id="hw-items" title="以下为服务端硬件信息（每 5 秒自动刷新）">
        <div class="hw-item">
          <span class="hw-label" id="hw-scope" data-i18n="服务端">服务端</span>
        </div>
        <div class="hw-item">
          <span class="hw-label">CPU</span>
          <span class="hw-value" id="cpu-info">--</span>
        </div>
        <div class="hw-item">
          <span class="hw-label" data-i18n="内存">内存</span>
          <span class="hw-value" id="ram-info">--</span>
        </div>
        <div class="hw-item">
          <span class="hw-label" data-i18n="硬盘">硬盘</span>
          <span class="hw-value" id="disk-info">--</span>
        </div>
      </div>

    </div>


  </div>

  <script type="module">
    // ===== 全局基础设施 =====
    const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
    const listen = window.__TAURI__?.event?.listen || window.__TAURI_INTERNALS__?.listen;
    window.__agent_invoke = invoke;
    window.__agent_listen = listen;

    // 预加载 i18n 模块并同步绑定 t()（顶层 await，后续所有动态文本走 t）
    const _i18n = await import("./i18n.js");
    const t = _i18n.t;
    // 统一错误友好提示（语言感知：中文界面全中文，英文界面英文提示+原文）

    let systemInfo = null;

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + sizes[i];
    }

    // HTML 转义：远端 update.json 下发的版本号 / 地址会拼进弹窗 innerHTML，需真实转义防注入
    function escHtml(s) {
      if (s == null) return "";
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }



    // 升级日志（update.json 各平台 content 字段指向的升级说明页）：

    // ===== 更新弹窗 =====

    async function checkForUpdate(silent) {

          if (silent) {

        } else if (result.has_update) {

            <div class="update-icon">✅</div>

    function onSystemUpdateDismiss() {

    // ===== 应用自升级（检测到新版本即弹窗 → 后台下载 → 下载完成后提示升级）=====
    // 启动检查发现新版本时立即弹窗（窗口内继续后台下载、可查看升级日志），安装包落盘后在同一窗口询问是否立即升级。
    // 安装包保留在本地（get_base_dir/updates），用户「稍后再说」后重启即已就绪、无需重下。
    const APP_UPDATE_SKIP_KEY = "tiger_skip_update_version";
    let appUpdate = null;              // { version, currentVersion, path, status: downloading|ready|error, progress, error, manual, prompted }
    let appUpdatePromptPending = false; // 升级提示被其它弹窗推迟

    function skippedAppUpdateVersion() {
      try { return localStorage.getItem(APP_UPDATE_SKIP_KEY) || ""; } catch (_) { return ""; }
    }

    function renderAppUpdateDialog() {
      if (!appUpdate) return;
      const versionRow = `
        <div class="update-info-row">
          <div class="info-item"><div class="info-label">${t("当前版本")}</div><div class="info-value">v${escHtml(appUpdate.currentVersion || "")}</div></div>
          <div class="info-item"><div class="info-label">${t("最新版本")}</div><div class="info-value">v${escHtml(appUpdate.version || "")}</div></div>
        </div>`;

      if (appUpdate.status === "ready") {
        appUpdate.prompted = true;
        showUpdateDialog(`
          <div class="update-icon">🚀</div>
          <div class="update-title">${t("新版本已下载完成")}</div>
          <div class="update-desc">${t("新版本安装包已在后台下载完成，是否立即升级？升级会自动启动安装包并关闭当前软件。")}</div>
          ${versionRow}
          <div class="update-buttons">
            <button class="update-btn-primary" onclick="onAppUpdateInstall()">${t("立即升级")}</button>
            <button class="update-btn-secondary" onclick="onSystemUpdateDismiss()">${t("稍后再说")}</button>
          </div>
          <div class="update-buttons" style="margin-top:10px;">
            ${changelogButton(appUpdate.changelogUrl)}
            <button class="update-btn-secondary" style="font-size:12px;padding:6px 18px;" onclick="onAppUpdateSkipVersion()">${t("跳过此版本")}</button>
          </div>`, "app-update");
        return;
      }

      if (appUpdate.status === "error") {
        // 安装阶段失败时给一个「打开安装包所在目录」入口：Linux 的 deb 自动安装失败
        // 需要用户按提示手动执行命令，能直接看到安装包更省事
        const revealBtn = (appUpdate.phase === "install" && appUpdate.path)
          ? `<button class="update-btn-secondary" onclick="onAppUpdateReveal()">${t("打开安装包所在目录")}</button>`
          : "";
        showUpdateDialog(`
          <div class="update-icon">❌</div>
          <div class="update-title">${escHtml(appUpdate.errorTitle || t("下载更新失败"))}</div>
          <div class="update-desc" style="white-space:pre-wrap;text-align:left;word-break:break-all;">${escHtml(appUpdate.error || "")}</div>
          ${versionRow}
          <div class="update-buttons">
            <button class="update-btn-primary" onclick="onAppUpdateRetry()">${t("重试")}</button>
            <button class="update-btn-secondary" onclick="onSystemUpdateDismiss()">${t("稍后再说")}</button>
            ${revealBtn}
          </div>`, "app-update");
        return;
      }

      // downloading：用户主动检查时展示进度（启动时的静默下载不会走到这里）
      showUpdateDialog(`
        <div class="update-icon">📥</div>
        <div class="update-title">${t("发现新版本")}</div>
        <div class="update-desc">${t("正在后台下载新版本，下载完成后会提示您升级。")}</div>
        ${versionRow}
        <div class="update-progress-bar"><div class="update-progress-fill" id="app-update-progress-fill" style="width: ${Number(appUpdate.progress) || 0}%"></div></div>
        <div class="update-status-text" id="app-update-status-text">${t("正在下载... ")}${Number(appUpdate.progress) || 0}%</div>
        <div class="update-buttons" style="margin-top:16px;">
          ${changelogButton(appUpdate.changelogUrl)}
          <button class="update-btn-secondary" onclick="hideUpdateDialog()">${t("后台下载，稍后再说")}</button>
        </div>`, "app-update");
    }

    // 安装包就绪：无人打扰时就弹窗，弹窗被其它提示占用则等它关闭后补弹
    function tryShowAppUpdateReady() {
      if (!appUpdate || appUpdate.status !== "ready" || appUpdate.prompted) return;
      // 用户点过「跳过此版本」：静默检查不再打扰（手动点「检查新版本」时仍照常提示）
      if (skippedAppUpdateVersion() === appUpdate.version && !appUpdate.manual) return;
      if (document.getElementById("update-overlay").classList.contains("show") && updateDialogOwner !== "app-update") {
        appUpdatePromptPending = true;
        return;
      }
      renderAppUpdateDialog();
    }

    // 后台静默下载安装包；返回是否新发起了一次下载
    function startAppUpdateDownload(result, opts) {
      opts = opts || {};
      if (!result || !result.has_update || !result.download_url) return false;
      // 已跳过该版本的静默下载不再重跑；手动检查（manual）时忽略跳过记录
      if (opts.manual !== true && skippedAppUpdateVersion() === result.remote_version) return false;
      if (appUpdate && appUpdate.version === result.remote_version
        && (appUpdate.status === "downloading" || appUpdate.status === "ready")) {
        if (opts.manual) appUpdate.manual = true;
        return false;
      }
      appUpdate = {
        version: result.remote_version,
        currentVersion: result.current_version,
        downloadUrl: result.download_url,
        changelogUrl: result.changelog_url || "",
        path: null,
        status: "downloading",
        progress: 0,
        error: "",
        errorTitle: "",
        phase: "download",     // download | install（决定失败弹窗标题与重试方式）
        manual: !!opts.manual,
        prompted: false,
      };
      invoke("download_app_update", {
        version: result.remote_version,
        url: result.download_url,
      }).then(function (path) {
        if (!appUpdate || appUpdate.version !== result.remote_version) return;
        appUpdate.path = path;
        appUpdate.progress = 100;
        appUpdate.status = "ready";
        tryShowAppUpdateReady();
      }).catch(function (e) {
        if (!appUpdate || appUpdate.version !== result.remote_version) return;
        appUpdate.status = "error";
        appUpdate.phase = "download";
        appUpdate.errorTitle = t("下载更新失败");
        appUpdate.error = _errMod.friendlyError(e, { prefix: "下载更新失败: " });
        // 静默下载失败不弹窗（不打扰用户），仅用户主动查看过进度时把失败原因显示出来
        if (appUpdate.manual && updateDialogOwner === "app-update") renderAppUpdateDialog();
      });
      return true;
    }

    // 对外统一入口（settings 页「检查新版本」复用）：manual=true 时展示下载进度
    function startAppUpdate(result, opts) {
      opts = opts || {};
      startAppUpdateDownload(result, { manual: opts.manual });
      if (opts.manual) renderAppUpdateDialog();
    }

    async function onAppUpdateInstall() {
      if (!appUpdate || appUpdate.status !== "ready") return;
      const installerPath = appUpdate.path;
      if (!installerPath) { onAppUpdateRetry(); return; }
      // Linux 的 deb 交给包管理器提权安装（弹系统授权框 -> 等安装结束），
      // 与 Windows/macOS 拉起安装向导后立刻退出不同，这里的文案要分开
      const isDeb = /\.deb$/i.test(installerPath);
      appUpdate.phase = "install";
      appUpdate.errorTitle = "";
      showUpdateDialog(`
        <div class="update-icon">⚙️</div>
        <div class="update-title">${t(isDeb ? "正在安装新版本" : "正在启动安装程序")}</div>
        <div class="update-desc">${t(isDeb ? "请在系统授权弹窗中输入密码；安装完成后 Tiger 会自动关闭。" : "Tiger 即将关闭并完成升级，请按安装程序提示操作。")}</div>
        <div class="update-status-text">${t("请稍候...")}</div>`, "app-update");
      try {
        // 后端拉起安装程序后会直接退出本进程，这里的 Promise 通常不会返回；
        // deb 安装是例外：失败时后端带着原因返回，需要展示给用户（此时应用仍在运行）
        await invoke("install_app_update", { path: installerPath });
      } catch (e) {
        appUpdate.status = "error";
        // 这里的错是后端写好的中文指引（含 sudo 命令与 apt 输出），不能再走
        // friendlyError——它会把夹带英文/路径的细节整段丢掉，只剩"操作失败，任务中断"
        appUpdate.errorTitle = t("升级失败");
        appUpdate.error = _errMod.getErrorMessage(e) || t("升级失败");
        renderAppUpdateDialog();
      }
    }

    function onAppUpdateRetry() {
      if (!appUpdate) return;
      // 安装阶段失败：安装包已在本地，直接重跑安装，不重新下载
      if (appUpdate.phase === "install" && appUpdate.path) {
        appUpdate.status = "ready";
        appUpdate.error = "";
        onAppUpdateInstall();
        return;
      }
      const result = {
        has_update: true,
        download_url: appUpdate.downloadUrl,
        remote_version: appUpdate.version,
        current_version: appUpdate.currentVersion,
        changelog_url: appUpdate.changelogUrl,
      };
      if (!result.download_url) { hideUpdateDialog(); return; }
      // 必须先把状态挪出 downloading/ready：startAppUpdateDownload 对同版本的这两种
      // 状态会直接返回，预置成 downloading 会让「重试」在没有下载在跑时空转；
      // 已就绪（ready）时不重置——安装包已在本地，不该再下一遍
      if (appUpdate.status !== "ready") {
        appUpdate.status = "error";
        appUpdate.progress = 0;
        appUpdate.error = "";
        appUpdate.errorTitle = "";
        appUpdate.phase = "download";
      }
      startAppUpdateDownload(result, { manual: true });
      renderAppUpdateDialog();
    }

    // 在文件管理器中定位安装包（deb 自动安装失败时方便用户手动执行命令）
    function onAppUpdateReveal() {
      const target = appUpdate && appUpdate.path;
      if (!target) return;
      invoke("plugin:opener|reveal_item_in_dir", { path: target }).catch(function (e) {
        console.warn("[index] 打开安装包目录失败:", e);
      });
    }

    function onAppUpdateSkipVersion() {
      if (appUpdate && appUpdate.version) {
        try { localStorage.setItem(APP_UPDATE_SKIP_KEY, appUpdate.version); } catch (_) {}
      }
      onSystemUpdateDismiss();
    }

    function setupAppUpdateProgressListener() {
      if (typeof listen !== "function") return;
      try {
        listen("app-update-progress", function (event) {
          if (!appUpdate) return;
          const payload = event.payload || {};
          if (payload.status === "downloading") {
            appUpdate.progress = payload.progress || 0;
            if (updateDialogOwner === "app-update") {
              const fill = document.getElementById("app-update-progress-fill");
              const text = document.getElementById("app-update-status-text");
              if (fill) fill.style.width = appUpdate.progress + "%";
              if (text) text.textContent = t("正在下载... ") + appUpdate.progress + "%";
            }
          }
        });
      } catch (_) {}
    }

    // ===== Agent 入口 =====
    async function goAgent() {
      try {
        const osName = String(await invoke("get_platform_os")).toLowerCase();
        const supported = osName === "windows" || osName === "macos" || osName === "linux";
        if (!supported) { showComingSoon(); return; }
        if (osName === "macos") {
          const arch = String(await invoke("get_platform_arch")).toLowerCase();
          if (arch !== "aarch64" && arch !== "arm64") {
            showComingSoon(t("当前仅支持 Apple Silicon (M 系列) Mac"));
            return;
          }
        }
        location.hash = "#/agent";
      } catch (e) {
        showComingSoon(_errMod.friendlyError(e, { prefix: "操作失败: " }));
      }
    }

    function showComingSoon(msg) {
      let tip = document.getElementById("os-tip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "os-tip";
        tip.className = "global-toast";
        document.body.appendChild(tip);
      }
      tip.textContent = msg || t("该功能即将开放，敬请期待");
      tip.style.display = "block";
      clearTimeout(showComingSoon._t);
      showComingSoon._t = setTimeout(function () { tip.style.display = "none"; }, 2500);
    }

    let _globalToastTimer = null;

      tip.textContent = msg;
      tip.style.display = "block";

      _globalToastTimer = setTimeout(function () { tip.style.display = "none"; }, 3000);

    // ===== Agent 忙碌指示 =====
    // store.js syncAgentBusy 在运行态变化时派发 agent-busy-changed：
    // - 运行中：#agent-btn 显示脉冲圆点（切到其它页面也能看到进度）；
    // - 在其它页面完成：弹轻提示 + #agent-btn 显示未读圆点，回到 Agent 页清除。
    let agentBusyPrev = false;
    function setAgentBadge(busy, unread) {
      const btn = document.getElementById("agent-btn");
      if (!btn) return;
      btn.classList.toggle("busy", !!busy);
      btn.classList.toggle("unread", !!unread);
    }
    window.addEventListener("agent-busy-changed", function (ev) {
      const busy = !!(ev && ev.detail && ev.detail.busy);
      if (busy) {
        setAgentBadge(true, false);
      } else if (agentBusyPrev && currentRoutePath !== "/agent") {
        setAgentBadge(false, true);
        showGlobalToast(t("Agent 已完成本轮工作，可回到 Agent 页面查看"));
      } else {
        setAgentBadge(false, false);
      }
      agentBusyPrev = busy;
    });

    // 暴露给视图模块（如 settings 调用）
    window.Agent = {
      showUpdateDialog,
      hideUpdateDialog,
      checkForUpdate,
      // 应用自升级：下载/升级状态查询与触发（settings 页「检查新版本」复用同一流程）
      startAppUpdate,
      getAppUpdate: function () { return appUpdate; },
      // 升级日志：settings 页复用同一个按钮（地址同样不进 onclick）
      changelogButton,
      openChangelog,
      // 服务端硬件信息：保存连接成功后立即刷新底部状态栏
      refreshSystemInfo,
    };

    window.goAgent = goAgent;
    window.navigateTo = navigateTo;
    window.openUrl = openUrl;
    window.onSystemUpdateDismiss = onSystemUpdateDismiss;
    window.onAppUpdateInstall = onAppUpdateInstall;
    window.onAppUpdateRetry = onAppUpdateRetry;
    window.onAppUpdateReveal = onAppUpdateReveal;
    window.onAppUpdateSkipVersion = onAppUpdateSkipVersion;
    window.openChangelog = openChangelog;

    // ===== 硬件栏 =====
    // 数据源固定为服务端 GET /v1/system/info：CPU 使用率 / 内存已用-总量 / 数据卷可用-总量。
    // 显卡探测已从服务端删除（不再执行 nvidia-smi），状态栏也不再显示显存。
    const SYSTEM_INFO_POLL_MS = 5000;
    let systemInfoPollTimer = null;
    let systemInfoLoading = false;
    let systemInfoLoadedOnce = false;
    let systemInfoWarned = false;

    // 「已用 / 总量」；总量缺失显示 --，内存类在 used=0 时视为未知（macOS 只报总量）
    function formatPair(used, total, zeroMeansUnknown) {
      if (!total) return "--";
      if (zeroMeansUnknown && !used) return "-- / " + formatBytes(total);
      return formatBytes(used) + " / " + formatBytes(total);
    }

    function setHardwareBarOffline() {
      ["cpu-info", "ram-info", "disk-info"].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = t("未连接");
        el.removeAttribute("title");
      });
    }

    function updateHardwareBar() {
      if (!systemInfo) return;
      try {
        const cpuEl = document.getElementById("cpu-info");
        const usage = systemInfo.cpu_usage;
        const usageText = typeof usage === "number" && isFinite(usage) && usage >= 0
          ? Math.min(100, usage * 100).toFixed(1) + "%"
          : "--";
        if (cpuEl) {
          cpuEl.textContent = usageText;
          const cores = (systemInfo.cpu_physical_cores || "?") + "C/" + (systemInfo.cpu_logical_cores || "?") + "T";
          cpuEl.title = [systemInfo.cpu_model, cores, systemInfo.hostname].filter(Boolean).join(" · ");
        }
        const ramEl = document.getElementById("ram-info");
        if (ramEl) ramEl.textContent = formatPair(systemInfo.used_ram, systemInfo.total_ram, true);
        const diskEl = document.getElementById("disk-info");
        if (diskEl) diskEl.textContent = formatPair(systemInfo.disk_available, systemInfo.disk_total, false);
        const scopeEl = document.getElementById("hw-scope");
        if (scopeEl) scopeEl.title = systemInfo.hostname || "";
      } catch (e) {
        console.error("更新硬件栏失败:", e);
      }
    }

    // 读取一次服务端硬件信息并刷新状态栏；定时器与「保存连接成功」共用同一入口。
    async function refreshSystemInfo() {
      if (systemInfoLoading) return systemInfo;
      systemInfoLoading = true;
      try {
        const info = await invoke("get_system_info");
        systemInfo = info;
        window.__agent_state.systemInfo = info;
        systemInfoLoadedOnce = true;
        systemInfoWarned = false;
        updateHardwareBar();
        return systemInfo;
      } catch (e) {
        // 服务端未连接 / 重启中：首次失败显示「未连接」，之后保留上次数值并降噪日志
        if (!systemInfoWarned) {
          console.warn("[index] 读取服务端硬件信息失败（每 5s 重试）:", e);
          systemInfoWarned = true;
        }
        if (!systemInfoLoadedOnce) setHardwareBarOffline();
        return null;
      } finally {
        systemInfoLoading = false;
      }
    }

    function startSystemInfoPolling() {
      if (systemInfoPollTimer) return;
      systemInfoPollTimer = setInterval(function () {
        if (!document.hidden) refreshSystemInfo();
      }, SYSTEM_INFO_POLL_MS);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) refreshSystemInfo();
      });
    }

    // ===== 启动自检：服务端连接配置 + 健康状态 =====
    // 桌面端只有一种连接方式：用户自行启动的 TCP + TLS 服务端，连接串在设置页粘贴
    // （地址 + 服务端指纹 + token）。顺序是 ① 连接串是否可解析 → ② 已配置则确认能否连上（/v1/health）；
    // 任一不满足都弹窗提示，确认后跳到「设置 → 服务端连接」面板
    // （`?panel=server` 由 settings 视图消费）。
    const SERVER_CHECK_INTERVAL_MS = 1500;
    const SERVER_CHECK_TIMEOUT_MS = 15000;
    let serverAlertShown = false;

    function errText(e) {
      if (e == null) return "";
      if (typeof e === "string") return e;
      return e.message || String(e);
    }

    function showServerAlert(detail) {
      if (serverAlertShown) return;
      serverAlertShown = true;
      const detailEl = document.getElementById("server-alert-detail");
      if (detailEl) detailEl.textContent = detail || "";
      document.getElementById("server-alert-overlay").classList.add("show");
      console.warn("[index] 服务端自检失败:", detail);
      logRouteDebug("[SERVER-CHECK] 服务端异常弹窗: " + (detail || ""));
    }

    function hideServerAlert() {
      document.getElementById("server-alert-overlay").classList.remove("show");
    }

    // 返回 null 表示服务端可用；返回字符串表示失败原因（直接展示给用户）
    async function probeServer() {
      let conn = null;
      try {
        conn = await invoke("get_server_connection");
      } catch (e) {
        return t("读取服务端配置失败: ") + errText(e);
      }

      // ① 配置完整性：连接串（地址 + 服务端指纹 + token）必须可解析（后端会给出具体缺哪项）
      if (!conn || !conn.configured || conn.error) {
        return (conn && conn.error) || t("服务端连接未配置：请在设置 → 服务端连接中粘贴服务端连接串（tigerAgent://…）");
      }

      // ② 可用性：轮询 /v1/health。服务端由用户自行启动，可能刚启动或正在重启，
      // 短暂重试比一次判定更贴近真实情况。
      const deadline = Date.now() + SERVER_CHECK_TIMEOUT_MS;
      let lastErr = "";
      while (Date.now() < deadline) {
        try {
          await invoke("test_server_connection");
          return null;
        } catch (e) {
          lastErr = errText(e);
        }
        await sleep(SERVER_CHECK_INTERVAL_MS);
      }
      return lastErr || t("服务端健康检查超时");
    }

    async function checkServerOnStartup() {
      const reason = await probeServer();
      if (!reason) return;
      showServerAlert(reason);
    }

    document.getElementById("server-alert-ok").addEventListener("click", function () {
      hideServerAlert();
      // 设置页会读 ?panel=server 直接切到「服务端连接」并自动跑一次检测
      navigateTo("/settings?panel=server");
    });

    // ===== 路由器 =====
    const routes = {
      "/settings": { load: () => import("./views/settings.js"),       nav: "settings-btn" },
      "/agent":    { load: () => import("./views/agent.js"),          nav: "agent-btn" },
      "/projects": { load: () => import("./views/projects.js"),       nav: "projects-btn" },
      "/scm":      { load: () => import("./views/scm.js"),           nav: "scm-btn" },
      "/skills":   { load: () => import("./views/skills.js"),         nav: "skills-btn" },
    };

    // Agent 视图常驻层：首次进入 /agent 时创建并挂载，之后切页只隐藏不卸载——
    // 流式渲染、SSE 订阅、滚动位置与正在进行的运行态全部保留。
    const viewRoot = document.getElementById("view-root");
    let agentLayer = null;
    let agentView = null;
    let currentView = null;       // 当前正在显示的视图实例（agent 常驻视图或普通视图）
    let currentContainer = null;  // 当前显示视图的宿主容器（#view-root / #agent-layer）
    let renderSeq = 0;
    // 当前已渲染路由的 path 与 path+query：用于识别同一路由的重复渲染请求
    // （如重复点击当前 TAB），视图已在位时直接跳过，避免无谓的卸载重挂/重初始化。
    let currentRoutePath = null;
    let currentRouteKey = null;
    const TRANSITION_FADE_OUT_MS = 160;
    const TRANSITION_FADE_IN_MS = 200;
    const TRANSITION_LOADING_THRESHOLD_MS = 180;

    // 懒创建 agent 常驻容器（放在 #view-root 前面，二者互斥显示，始终只有一个是 display:flex）
    function getAgentLayer() {
      if (!agentLayer) {
        agentLayer = document.createElement("div");
        agentLayer.id = "agent-layer";
        agentLayer.style.display = "none";
        viewRoot.parentNode.insertBefore(agentLayer, viewRoot);
      }
      return agentLayer;
    }

    // 宿主容器互斥显示
    function showHost(container) {
      if (container === viewRoot) {
        if (agentLayer) agentLayer.style.display = "none";
        viewRoot.style.display = "flex";
      } else {
        viewRoot.style.display = "none";
        container.style.display = "flex";
      }
    }

    function setProgress(active) {
      const bar = document.getElementById("view-progress");
      if (!bar) return;
      if (active) { bar.classList.add("show", "anim"); }
      else { bar.classList.remove("show", "anim"); bar.style.width = ""; bar.style.marginLeft = ""; }
    }

    function renderLoadingInto(root) {
      root.innerHTML =
        '<div class="view-loading"><div class="view-loading-spinner"></div><div class="view-loading-text">' + t("页面加载中...") + '</div></div>';
    }

    function renderErrorInto(root, msg) {
      root.innerHTML = '<div style="padding:40px;color:#ff6b6b;">' + t("页面加载失败: ") + msg + '</div>';
    }

    // 等待下一帧（保证 transition 真的生效）
    function nextFrame() {
      return new Promise(function (resolve) {
        requestAnimationFrame(function () { requestAnimationFrame(resolve); });
      });
    }

    function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    // 视图进入：先 opacity 0，下一帧加 view-active 触发 transition
    async function fadeIn(container, seq) {
      container.classList.add("view-entering");
      await nextFrame();
      if (seq !== renderSeq) return;
      container.classList.remove("view-entering");
      container.classList.add("view-active");
      // fade-in 完成后清理标记（保留 class 让后续切走还能 fade-out）
      setTimeout(function () {
        if (seq === renderSeq) container.classList.remove("view-active");
      }, TRANSITION_FADE_IN_MS + 30);
    }

    // 路由诊断日志：把 hash 变化与当前路由写进 tigerAgent_debug.log（调试模式关闭时
    // 服务端直接丢弃，无文件开销）。用于复盘「运行中偶发离开 Agent 页」这类浏览器级
    // 导航问题：对比相邻两行的 href 与 history.length 可判断是历史前进/后退
    // （href 无 #、len 不增）还是落到空 fragment（href 以 # 结尾）。
    function logRouteDebug(msg) {
      try {
        if (window.__agent_invoke) window.__agent_invoke("agent_debug_log", { line: "[ROUTE] " + msg });
      } catch (_) {}
    }

    async function renderRoute() {
      const seq = ++renderSeq;
      const hash = location.hash || "#/agent";
      console.log("[index] renderRoute() hash:", hash);
      const clean = hash.replace(/^#/, "");
      const qIndex = clean.indexOf("?");
      const rawPath = qIndex >= 0 ? clean.substring(0, qIndex) : clean;
      const queryStr = qIndex >= 0 ? clean.substring(qIndex + 1) : "";
      const params = {};
      if (queryStr) {
        queryStr.split("&").forEach((pair) => {
          const idx = pair.indexOf("=");
          const k = decodeURIComponent(pair.substring(0, idx >= 0 ? idx : pair.length));
          const v = idx >= 0 ? decodeURIComponent(pair.substring(idx + 1)) : "";
          params[k] = v;
        });
      }

      // 未知/空 hash 统一回退到 Agent 页：归一化后的 path 决定宿主容器与 currentRoutePath，
      // 不能让「回退到 agent 路由」却挂进 #view-root（否则常驻层状态判断会错位）。
      const path = routes[rawPath] ? rawPath : "/agent";
      const route = routes[path];
      logRouteDebug("hashchange href=" + location.href + " len=" + history.length +
        " busy=" + !!(window.__agent_state && window.__agent_state.agentBusy) +
        " cur=" + (currentRoutePath || "-"));

      // 同一路由（含查询参数）重复请求：视图已在位，跳过渲染（避免卸载重挂与重初始化）。
      // 顺手恢复过渡态：上一次切换可能在 fade-out 途中被本次路由打断，
      // 残留的 view-leaving 会让当前视图一直停在 opacity:0。
      const routeKey = path + "?" + queryStr;
      if (routeKey === currentRouteKey && currentView) {
        if (currentContainer) {
          currentContainer.classList.remove("view-leaving");
          currentContainer.classList.add("view-active");
        }
        return;
      }

      setActiveNav(route.nav);
      // 回到 Agent 页：清掉「后台已完成」未读角标
      if (route.nav === "agent-btn") {
        setAgentBadge(!!(window.__agent_state && window.__agent_state.agentBusy), false);
      }

      const isAgent = path === "/agent";
      const target = isAgent ? getAgentLayer() : viewRoot;
      const prev = currentContainer;

      // ===== Phase 1: fade-out 旧视图 =====
      if (prev) {
        prev.classList.remove("view-active");
        prev.classList.add("view-leaving");
        await sleep(TRANSITION_FADE_OUT_MS);
        if (seq !== renderSeq) return; // 期间又路由了，丢弃
        prev.classList.remove("view-leaving");
        if (prev === target) {
          // 同一宿主切换：普通视图卸载重挂；Agent 常驻视图不卸载（仅 query 变化）
          if (currentView && currentView !== agentView) {
            try { currentView.unmount(); } catch (_) {}
            currentView = null;
          }
          if (prev === viewRoot) prev.innerHTML = "";
        } else {
          prev.style.display = "none";
          if (agentView && currentView === agentView) {
            // Agent 常驻视图：只通知隐藏（收起浮层），不卸载——运行态/SSE/DOM 全保留
            try { if (agentView.hide) agentView.hide(); } catch (_) {}
          } else if (currentView) {
            try { currentView.unmount(); } catch (_) {}
            if (prev === viewRoot) prev.innerHTML = "";
          }
          currentView = null;
        }
      }

      if (seq !== renderSeq) return;

      // ===== Phase 2: 目标容器就位 + 加载模块 / 复用常驻视图 =====
      showHost(target);
      currentContainer = target;

      // Agent 常驻视图已挂载：直接复用（不重拉会话、不重连 SSE、不重跑 init）
      if (isAgent && agentView) {
        currentView = agentView;
        currentContainer = target;
        currentRoutePath = path;
        currentRouteKey = routeKey;
        // 隐藏期间尺寸为 0：回到页面时重算轮容器高度上限、补一次贴底
        try { if (agentView.show) agentView.show(); } catch (e) { console.error("[index] agent show() 失败:", e); }
        await fadeIn(target, seq);
        console.log("[index] Agent 常驻视图已恢复:", path);
        return;
      }

      const loadingTimer = setTimeout(function () {
        if (seq !== renderSeq) return;
        setProgress(true);
        renderLoadingInto(target);
      }, TRANSITION_LOADING_THRESHOLD_MS);

      let mod = null;
      let loadErr = null;
      try {
        mod = await route.load();
      } catch (e) {
        loadErr = e;
      }
      clearTimeout(loadingTimer);
      setProgress(false);

      if (seq !== renderSeq) return; // 加载期间路由已切换，本次渲染作废

      // ===== Phase 3: 挂载并 fade-in =====
      target.innerHTML = "";

      if (loadErr) {
        console.error("[index] 加载视图失败:", loadErr);
        renderErrorInto(target, loadErr);
        return;
      }

      try {
        const view = mod.default;
        console.log("[index] 加载视图模块:", path);
        // mount 成功后才记账 currentView：mount 抛错时不把坏视图暴露给后续导航
        view.mount(target, params);
        currentView = view;
        if (isAgent) agentView = view;
        currentContainer = target;
        currentRoutePath = path;
        currentRouteKey = routeKey;
        await fadeIn(target, seq);
        console.log("[index] 视图已挂载:", path);
      } catch (e) {
        console.error("[index] 挂载视图失败:", e);
        renderErrorInto(target, e);
      }
    }

    window.addEventListener("hashchange", renderRoute);

    // ===== 初始化 =====
    // 服务端硬件检测与首屏渲染、服务端自检同时并行执行（异步、不等待）：
    // 首次打开页面时不因硬件信息未就绪阻塞其它初始化，结果回来后由
    // updateHardwareBar 刷新底部状态栏。
    function init() {
      console.log("[index] init() 开始初始化");
      setupAppUpdateProgressListener();
      setActiveNav("agent-btn");
      refreshSystemInfo().then(function () {
        console.log("[index] 系统信息获取完成:", systemInfo);
      }).catch(function (e) {
        console.error("[index] 获取系统信息失败:", e);
      });
      // 服务端状态栏定时刷新（5s）：服务端没连上时也会继续重试，连接成功后自动恢复
      startSystemInfoPolling();
      console.log("[index] init() 完成");
    }

    // 注意：硬件栏展示的是服务端主机实时状态（GET /v1/system/info）。
    // 旧实现会用 hwinfo 插件拿本机 CPU/内存/显卡覆盖服务端数值，在远程部署下
    // 等于把桌面端规格冒充成服务端能力，已删除；显卡探测也已从服务端移除。

    setTimeout(() => { checkForUpdate(true); }, 3000);

    init();
    renderRoute();
    // 服务端自检不阻塞首屏：与 Agent 视图初始化并行跑，只有失败才弹窗
    checkServerOnStartup().catch(function (e) {
      console.warn("[index] 服务端自检异常:", e);
    });
  </script>
</body>
</html>
